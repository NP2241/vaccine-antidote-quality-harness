[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alignment-eval-harness"
version = "0.1.0"
description = "Cleaned companion repo: SFT/Vaccine/RepNoise alignment experiments and a behavioral eval + moderation judge loop (from a CS639 class project)."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["alignment", "vaccine", "antidote", "behavioral-eval", "llm-safety", "huggingface"]
dependencies = [
  "torch>=2.0.0",
  "transformers>=4.36.0",
  "peft>=0.7.0",
  "tqdm>=4.65.0",
  "datasets>=2.14.0",
  "accelerate>=0.25.0",
  "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
beq = "beq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
